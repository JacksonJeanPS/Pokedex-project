<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="icon" href="./favicons/favicon-16x16.png">
    <link rel="stylesheet" href="./css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Rubik&display=swap" rel="stylesheet" />
</head>
<body>
    <header>
        <h1>Pokédex</h1>
    </header>

    <main>
        <section class="search-section" aria-label="Busca de Pokémon">
            <div class="search-bar">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Buscar por nome ou número..."
                    aria-label="Buscar Pokémon por nome ou número"
                    autocomplete="off"
                >
                <button id="searchBtn" aria-label="Buscar Pokémon">Buscar</button>
            </div>
            <div class="filter-section">
                <div id="typeFilters" class="type-filters" role="group" aria-label="Filtrar por tipo"></div>
                <button id="favoritesBtn" aria-pressed="false" aria-label="Alternar favoritos">⭐ Favoritos</button>
            </div>
        </section>

        <div class="status-bar" aria-live="polite">
            <div id="loading" class="hidden">
                <div class="spinner" role="status" aria-label="Carregando"></div>
            </div>
            <div id="error" class="hidden"></div>
            <p id="emptyState" class="hidden">Nenhum Pokémon encontrado.</p>
        </div>

        <section class="pokedex-grid" aria-label="Lista de Pokémon">
            <ul id="pokedex" class="pokedex" data-js="pokedex" role="list"></ul>
        </section>

        <div class="load-more">
            <button id="loadMoreBtn" class="btn-load-more hidden">Carregar Mais</button>
        </div>
    </main>

    <div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="Detalhes do Pokémon" aria-hidden="true">
        <div class="modal-content">
            <button class="modal-close" aria-label="Fechar detalhes">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
